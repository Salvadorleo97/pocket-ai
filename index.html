<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pocket AI</title>
<meta name="theme-color" content="#0e0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket AI">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #0e0e12; --panel: #17171d; --panel2: #1f1f27; --line: #2a2a34;
    --text: #ececf1; --muted: #8e8ea0; --accent: #7c6cf0; --accent2: #a08cff; --danger: #ef6b6b;
    --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--line); background: var(--bg); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; flex: 1; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: #3ecf8e; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--panel); }
  .icon-btn svg { width: 20px; height: 20px; }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px 8px; }
  .msg { max-width: 88%; margin: 0 0 12px; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { margin-left: auto; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
  .msg.ai { background: var(--panel); border-bottom-left-radius: 6px; }
  .msg.ai pre { background: #0b0b0f; padding: 10px; border-radius: 10px; overflow-x: auto; white-space: pre; font-size: 13px; margin: 6px 0; }
  .msg.ai code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
  .msg.ai :not(pre) > code { background: #0b0b0f; padding: 1px 5px; border-radius: 5px; }
  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent2); }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { text-align: center; color: var(--muted); margin-top: 22vh; padding: 0 30px; }
  .empty img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 10px; }

  footer { padding: 8px 12px calc(var(--safe-bottom) + 8px); border-top: 1px solid var(--line); background: var(--bg); }
  .composer { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border-radius: 22px; padding: 6px 6px 6px 14px; }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; max-height: 140px; padding: 6px 0; }
  .send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .send:disabled { opacity: 0.35; }
  .send svg { width: 18px; height: 18px; }

  /* Setup screen */
  .setup { flex: 1; overflow-y: auto; padding: calc(var(--safe-top) + 28px) 20px calc(var(--safe-bottom) + 24px); }
  .setup .logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 14px; }
  .setup h2 { text-align: center; margin: 0 0 6px; font-size: 24px; }
  .setup p.lead { text-align: center; color: var(--muted); margin: 0 0 22px; }
  .model { display: block; width: 100%; text-align: left; background: var(--panel); border: 2px solid transparent;
    border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .model.sel { border-color: var(--accent); }
  .model b { display: block; }
  .model span { color: var(--muted); font-size: 14px; }
  .model .tag { float: right; font-size: 12px; color: var(--accent2); }
  .primary { width: 100%; padding: 14px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; margin-top: 8px; }
  .primary:disabled { opacity: 0.5; }
  .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin: 18px 0 8px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }
  .note { color: var(--muted); font-size: 13px; text-align: center; }
  .warn { background: #2a1a1a; color: #ffb4b4; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }

  /* Menu sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-radius: 20px 20px 0 0;
    padding: 10px 12px calc(var(--safe-bottom) + 12px); z-index: 11; transform: translateY(100%); transition: transform .25s; }
  .sheet.open { transform: none; }
  .sheet button { display: block; width: 100%; text-align: left; padding: 14px; border-radius: 12px; }
  .sheet button:active { background: var(--panel2); }
  .sheet .danger { color: var(--danger); }
  .sheet .info { color: var(--muted); font-size: 13px; padding: 8px 14px 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Setup / download screen -->
<section id="setup" class="setup">
  <img class="logo" src="icon-512.png" alt="">
  <h2>Pocket AI</h2>
  <p class="lead">An AI that lives on your iPhone. Download a brain once on Wi‑Fi, then chat anywhere with no internet.</p>
  <div id="setupWarn" class="warn hidden"></div>
  <div id="modelList"></div>
  <button id="downloadBtn" class="primary" disabled>Loading…</button>
  <div id="progressWrap" class="hidden">
    <div class="bar"><div id="bar"></div></div>
    <div id="progressText" class="note"></div>
  </div>
  <p class="note" style="margin-top:18px">Keep the app open while it downloads. Everything stays on your phone. Replies take a moment to start, as the AI runs on your phone's own processor.</p>
</section>

<!-- Chat screen -->
<header id="chatHeader" class="hidden">
  <div style="flex:1">
    <h1>Pocket AI</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">Starting…</span></div>
  </div>
  <button class="icon-btn" id="newBtn" aria-label="New chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
  </button>
</header>
<main id="chat" class="hidden"></main>
<footer id="chatFooter" class="hidden">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" disabled aria-label="Send">
      <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</footer>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="info" id="sheetInfo"></div>
  <button id="adultBtn">🌶️ Adult mode: off</button>
  <button id="safeBtn">Safe mode: off</button>
  <button id="switchBtn">Switch AI model</button>
  <button id="clearBtn">Clear this chat</button>
  <button id="deleteBtn" class="danger">Delete downloaded model (frees space)</button>
  <button id="closeSheet">Cancel</button>
</div>

<script type="module">
// ===================================================================
// Pocket AI: a private chat AI that runs on the phone's CPU (llama.cpp
// compiled to WebAssembly, via the wllama library). No WebGPU, so it
// avoids Safari's WebGPU memory growth that crashed the earlier version.
// ===================================================================
const WL = "https://cdn.jsdelivr.net/npm/@wllama/wllama@4.0.0/";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- Offline support + multi-core speed ----------
// The service worker keeps the app working offline and adds the headers that
// let the AI use all CPU cores. The very first visit needs one quick reload
// for that to kick in.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(async () => {
    await navigator.serviceWorker.ready;
    if (!window.crossOriginIsolated && !sessionStorage.getItem("pocketai.reloaded")) {
      sessionStorage.setItem("pocketai.reloaded", "1");
      location.reload();
    }
  }).catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- Models ----------
const MODELS = [
  { id: "qwen3-1.7b", name: "Best · Qwen3 1.7B", desc: "Smartest of the three, a bit slower", size: "1.1 GB", rec: true,
    url: "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf" },
  { id: "llama3.2-1b", name: "Fast · Llama 3.2 1B", desc: "Quicker replies, a bit less clever", size: "810 MB",
    url: "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf" },
  { id: "qwen3-0.6b", name: "Tiny · Qwen3 0.6B", desc: "Fastest, simplest answers, smallest download", size: "400 MB",
    url: "https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf" },
];
const modelById = (id) => MODELS.find((m) => m.id === id);

// ---------- Personality ----------
const SYSTEM = "You are Pocket AI, a friendly, helpful assistant running offline on the user's iPhone. Keep answers clear and fairly short unless asked for detail. If you're not sure about a fact, say so.";
const SYSTEM_ADULT = "You are Pocket AI, a private assistant running offline on the user's own iPhone. The user is an adult (18+) and has switched on adult mode. In this mode you're casual, cheeky and flirty, you can swear, and you can talk about mature and romantic or sexual topics with the user and play along with adult roleplay when they ask. Everyone in any roleplay or story is an adult; never involve anyone under 18. Keep being helpful with normal questions too.";
let adultMode = !!store.get("pocketai.adult", false);
const systemPrompt = () => (adultMode ? SYSTEM_ADULT : SYSTEM);

// ---------- Memory settings ----------
// If iOS kills the app mid-reply, we notice on the next launch and switch to safe mode.
let safeMode = !!store.get("pocketai.safe", false);
let crashedLastTime = !!store.get("pocketai.inflight", false);
if (crashedLastTime) { safeMode = true; store.set("pocketai.safe", true); store.set("pocketai.inflight", false); }
const loadOpts = () => ({
  n_ctx: safeMode ? 1024 : 2048,
  n_batch: safeMode ? 64 : 256,
  n_gpu_layers: 0,          // CPU only: avoids the Safari WebGPU memory problem
  reasoning: false,         // Qwen3: answer directly, no long "thinking" first
  warmup: false,
});
const historyBudget = () => (safeMode ? 1500 : 3500); // characters of past chat the AI sees

// Qwen3 can "think out loud" in <think> tags. Hide that, show only the answer.
function stripThink(s) {
  s = s.replace(/<think>[\s\S]*?<\/think>\s*/g, "");
  const open = s.indexOf("<think>");
  return open >= 0 ? s.slice(0, open) : s;
}

// ---------- Engine ----------
let Wllama, wllama = null, loadedId = null, busy = false, selected = null;
let messages = store.get("pocketai.chat", []);
const quietLogger = { debug() {}, log() {}, warn: (...a) => console.warn(...a), error: (...a) => console.error(...a) };
const newEngine = () => new Wllama({ default: WL + "esm/wasm/wllama.wasm" },
  { allowOffline: true, suppressNativeLog: true, logger: quietLogger });

async function isDownloaded(m) {
  try {
    const cm = (wllama || newEngine()).cacheManager;
    const name = await cm.getNameFromURL(m.url);
    const size = await cm.getSize(name);
    if (size <= 0) return false;
    const meta = await cm.getMetadata(name);
    return !meta || !meta.originalSize || size === meta.originalSize;
  } catch { return false; }
}

function setupWarn(t) { const w = $("setupWarn"); w.textContent = t; w.classList.remove("hidden"); }

async function boot() {
  try {
    ({ Wllama } = await import(WL + "esm/index.js"));
  } catch (e) {
    console.error(e);
    setupWarn("Couldn't load the AI engine. The first time you open the app you need internet. After that it works offline.");
    const b = $("downloadBtn"); b.textContent = "Try again"; b.disabled = false; b.onclick = () => location.reload();
    return;
  }
  const saved = modelById(store.get("pocketai.model", ""));
  if (saved && await isDownloaded(saved)) { startChatUI(); await loadModel(saved.id, true); return; }
  renderModelList();
}

async function renderModelList() {
  const list = $("modelList");
  list.innerHTML = "";
  if (!selected || !modelById(selected)) selected = MODELS.find((m) => m.rec).id;
  for (const m of MODELS) {
    const b = document.createElement("button");
    b.className = "model" + (m.id === selected ? " sel" : "");
    b.innerHTML = `${m.rec ? '<span class="tag">Recommended</span>' : ""}<b>${m.name} · ${m.size}</b><span>${m.desc}</span>`;
    b.onclick = () => { selected = m.id; renderModelList(); };
    list.appendChild(b);
  }
  const btn = $("downloadBtn");
  btn.disabled = false;
  btn.textContent = (await isDownloaded(modelById(selected))) ? "Start" : "Download & start";
  btn.onclick = () => loadModel(selected, false);
}

async function loadModel(id, fromCache) {
  const m = modelById(id);
  busy = true; updateSend();
  const btn = $("downloadBtn");
  btn.disabled = true;
  btn.textContent = fromCache ? "Loading…" : "Downloading…";
  $("progressWrap").classList.remove("hidden");
  $("setupWarn").classList.add("hidden");
  setStatus(false, "Loading AI…");
  try {
    if (wllama) { try { await wllama.exit(); } catch {} }
    wllama = newEngine(); loadedId = null;
    await wllama.loadModelFromUrl(m.url, {
      ...loadOpts(),
      progressCallback: ({ loaded, total }) => {
        const pct = total ? Math.min(100, Math.round((loaded / total) * 100)) : 0;
        $("bar").style.width = pct + "%";
        $("progressText").textContent = `${pct}% · ${Math.round(loaded / 1048576)} of ${Math.round(total / 1048576)} MB`;
        setStatus(false, `Loading AI… ${pct}%`);
      },
    });
    loadedId = id;
    store.set("pocketai.model", id);
    startChatUI();
    refreshStatus();
    if (crashedLastTime) { crashedLastTime = false; notice("The app closed during the last reply, probably from running out of memory. I've switched on safe mode, which uses less. Try again, and if it still closes, pick the Tiny model from the ⋯ menu."); }
  } catch (e) {
    console.error(e);
    showSetup();
    const msg = String((e && e.message) || e);
    setupWarn(!navigator.onLine && !fromCache
      ? "You're offline and this model hasn't been downloaded yet. Connect to Wi‑Fi to download it."
      : /memory|OOM|out of|allocate/i.test(msg)
        ? "Your iPhone ran out of memory loading that model. Close other apps, turn on Safe mode, or pick a smaller one."
        : "Something went wrong loading the AI: " + msg);
    renderModelList();
  } finally {
    busy = false; updateSend();
  }
}

function refreshStatus() {
  const m = modelById(loadedId);
  const bits = [`${m ? m.name.split(" · ")[0] : "AI"} ready`];
  if (adultMode) bits.push("🌶️ adult");
  if (safeMode) bits.push("safe mode");
  bits.push("offline");
  setStatus(!!loadedId, bits.join(" · "));
}

// ---------- Screens ----------
function showSetup() {
  $("setup").classList.remove("hidden");
  for (const id of ["chatHeader", "chat", "chatFooter"]) $(id).classList.add("hidden");
}
function startChatUI() {
  $("setup").classList.add("hidden");
  for (const id of ["chatHeader", "chat", "chatFooter"]) $(id).classList.remove("hidden");
  renderChat();
}
function notice(text) {
  const d = document.createElement("div");
  d.className = "msg ai";
  d.style.cssText = "background:#2a2414;color:#ffd98a;font-size:14px";
  d.textContent = text;
  const chat = $("chat");
  if (!messages.length) chat.innerHTML = "";
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function setStatus(on, text) { $("dot").classList.toggle("on", on); $("statusText").textContent = text; }

// ---------- Chat rendering ----------
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function md(s) {
  return s.split(/```/).map((p, i) => {
    if (i % 2) return `<pre><code>${esc(p.replace(/^[a-zA-Z0-9+-]*\n/, ""))}</code></pre>`;
    return esc(p).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  }).join("");
}
function renderChat() {
  const chat = $("chat");
  chat.innerHTML = "";
  if (!messages.length) {
    chat.innerHTML = `<div class="empty"><img src="icon-192.png" alt=""><div>Ask me anything. I run entirely on your phone, so nothing you type leaves it.</div></div>`;
    return;
  }
  for (const m of messages) addBubble(m.role, m.content);
  chat.scrollTop = chat.scrollHeight;
}
function addBubble(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  if (role === "user") d.textContent = text; else d.innerHTML = md(text);
  $("chat").appendChild(d);
  return d;
}

// ---------- Sending ----------
const input = $("input"), sendBtn = $("sendBtn");
let generating = false, abortCtl = null;

function updateSend() {
  sendBtn.disabled = !generating && (!loadedId || busy || !input.value.trim());
  $("sendIcon").innerHTML = generating
    ? '<rect x="7" y="7" width="10" height="10" rx="2" fill="#fff" stroke="none"/>'
    : '<path d="M12 19V5M5 12l7-7 7 7"/>';
}
input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; updateSend();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) sendBtn.click(); }
});

sendBtn.onclick = async () => {
  if (generating) { try { abortCtl && abortCtl.abort(); } catch {} return; }
  const text = input.value.trim();
  if (!text || !loadedId) return;
  input.value = ""; input.style.height = "auto";
  if (!messages.length) $("chat").innerHTML = "";
  messages.push({ role: "user", content: text });
  store.set("pocketai.chat", messages);
  addBubble("user", text);
  const bubble = addBubble("assistant", "");
  bubble.classList.add("typing");
  bubble.innerHTML = "<i style='color:var(--muted)'>Thinking…</i>";
  $("chat").scrollTop = $("chat").scrollHeight;

  // Only send as much recent chat as fits in the AI's working memory.
  const recent = [];
  let chars = 0;
  for (let i = messages.length - 1; i >= 0; i--) {
    chars += messages[i].content.length;
    if (recent.length && chars > historyBudget()) break;
    recent.unshift(messages[i]);
  }
  if (recent[0] && recent[0].role === "assistant") recent.shift();

  generating = true; updateSend();
  abortCtl = new AbortController();
  store.set("pocketai.inflight", true); // if iOS kills us mid-reply, we'll know next launch
  let raw = "", reply = "", lastPaint = 0;
  const paint = (force) => {
    const now = performance.now();
    if (!force && now - lastPaint < 80) return; // repaint at most ~12x a second
    lastPaint = now;
    bubble.innerHTML = reply ? md(reply) : "<i style='color:var(--muted)'>Thinking…</i>";
    const c = $("chat");
    if (c.scrollHeight - c.scrollTop - c.clientHeight < 120) c.scrollTop = c.scrollHeight;
  };
  try {
    const stream = await wllama.createChatCompletion({
      messages: [{ role: "system", content: systemPrompt() }, ...recent],
      stream: true,
      max_tokens: safeMode ? 384 : 640,
      temperature: adultMode ? 0.8 : 0.7, top_p: 0.9, top_k: 40, penalty_repeat: 1.1,
      chat_template_kwargs: { enable_thinking: false },
      abortSignal: abortCtl.signal,
    });
    for await (const chunk of stream) {
      const delta = chunk.choices?.[0]?.delta?.content || "";
      if (delta) { raw += delta; reply = stripThink(raw).trimStart(); paint(false); }
    }
  } catch (e) {
    const aborted = abortCtl.signal.aborted || (e && /abort/i.test(e.name + " " + e.message));
    if (!aborted) {
      console.error(e);
      const msg = String((e && e.message) || e).slice(0, 300);
      if (!reply) reply = (/memory|OOM|allocate/i.test(msg)
        ? "I ran out of memory. Close the app fully (swipe it away), reopen it, and turn on Safe mode in the ⋯ menu."
        : /kv_cache|context/i.test(msg)
          ? "This chat got too long for my memory. Tap + to start a new chat."
          : "Sorry, something went wrong.") + "\n\nError details: `" + msg.replace(/`/g, "'") + "`";
    }
  }
  store.set("pocketai.inflight", false);
  bubble.classList.remove("typing");
  paint(true);
  if (!reply) bubble.innerHTML = "…";
  messages.push({ role: "assistant", content: reply });
  store.set("pocketai.chat", messages);
  generating = false; abortCtl = null; updateSend();
};

// ---------- Menu ----------
function openSheet() {
  const m = modelById(store.get("pocketai.model", ""));
  $("sheetInfo").textContent = m ? `Using: ${m.name} (${m.size})` : "";
  $("safeBtn").textContent = `Safe mode: ${safeMode ? "on (uses less memory, shorter replies)" : "off"}`;
  adultArmed = false;
  $("adultBtn").textContent = adultMode ? "🌶️ Adult mode: on (tap to turn off)" : "🌶️ Adult mode: off";
  deleteArmed = false;
  $("deleteBtn").textContent = "Delete downloaded model (frees space)";
  $("sheetBg").style.display = "block"; $("sheet").classList.add("open");
}
function closeSheet() { $("sheetBg").style.display = "none"; $("sheet").classList.remove("open"); }
$("menuBtn").onclick = openSheet;
$("sheetBg").onclick = closeSheet;
$("closeSheet").onclick = closeSheet;
$("newBtn").onclick = () => { if (generating) return; messages = []; store.set("pocketai.chat", messages); renderChat(); };
$("clearBtn").onclick = () => { closeSheet(); $("newBtn").click(); };

let adultArmed = false;
$("adultBtn").onclick = () => {
  if (adultMode) { adultMode = false; store.set("pocketai.adult", false); closeSheet(); refreshStatus(); return; }
  if (!adultArmed) { adultArmed = true; $("adultBtn").textContent = "Tap again to confirm you're 18 or older"; return; }
  adultMode = true; store.set("pocketai.adult", true); closeSheet(); refreshStatus();
  notice("🌶️ Adult mode is on. Tip: start a new chat (+) so the AI picks up the new vibe.");
};

$("safeBtn").onclick = async () => {
  closeSheet(); if (generating || busy) return;
  safeMode = !safeMode; store.set("pocketai.safe", safeMode);
  if (loadedId) await loadModel(loadedId, true); // reload the AI with the new memory settings
};
$("switchBtn").onclick = async () => {
  closeSheet(); if (generating) return;
  selected = store.get("pocketai.model", selected);
  $("progressWrap").classList.add("hidden"); $("setupWarn").classList.add("hidden");
  showSetup(); renderModelList();
};
let deleteArmed = false;
$("deleteBtn").onclick = async () => {
  if (!deleteArmed) { deleteArmed = true; $("deleteBtn").textContent = "Tap again to delete (you'll need Wi‑Fi to re-download)"; return; }
  deleteArmed = false;
  closeSheet();
  const m = modelById(store.get("pocketai.model", ""));
  try { if (wllama) await wllama.exit(); } catch {}
  try { if (m) await newEngine().cacheManager.delete(m.url); } catch (e) { console.error(e); }
  wllama = null; loadedId = null;
  store.set("pocketai.model", null);
  $("progressWrap").classList.add("hidden");
  showSetup(); renderModelList();
};

boot();
</script>
</body>
</html>
